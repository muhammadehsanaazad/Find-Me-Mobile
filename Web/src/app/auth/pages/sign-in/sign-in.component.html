<div class="container" style="width: 350px">
    <br /><br /><br />
    <h2>Sign In Form</h2>
    <form [formGroup]="authModel.loginBindingModel" autocomplete="off">
        <div class="form-group">
            <label>Email</label>
            <input type="email" class="form-control" placeholder="Enter email" formControlName="email">
            <span class="text-danger" *ngIf="
            authModel.loginBindingModel.get('email')?.touched &&
            authModel.loginBindingModel.get('email')?.invalid
          ">Email is not valid</span>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" class="form-control" placeholder="Enter password" formControlName="password">
            <span class="text-danger" *ngIf="
            authModel.loginBindingModel.get('password')?.touched &&
            authModel.loginBindingModel.get('password')?.invalid
          ">Password is not valid</span>
        </div>
        <button (click)="login()" class="btn btn-primary">Submit</button>
    </form>
</div>
